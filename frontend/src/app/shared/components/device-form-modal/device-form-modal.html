<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" role="dialog" aria-modal="true">
  <div class="w-full max-w-lg rounded-lg bg-white p-6 shadow-xl">
    <div class="mb-6 flex items-center justify-between">
      <h2 class="text-xl font-semibold text-gray-900">
        {{ mode === 'create' ? 'Register New Device' : 'Edit Device' }}
      </h2>
      <button type="button" aria-label="Close" (click)="close.emit()" class="text-2xl text-gray-500 hover:text-gray-900">
        &times;
      </button>
    </div>

    <div *ngIf="error" class="mb-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700">
      {{ error }}
    </div>

    <form [formGroup]="deviceForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="device-type" class="mb-1 block text-sm font-medium text-gray-700">Device Type *</label>
          <select id="device-type" formControlName="device_type" class="w-full rounded-lg border border-gray-300 px-3 py-2">
            <option value="">Select type</option>
            <option value="Phone">Phone</option>
            <option value="Tablet">Tablet</option>
            <option value="Laptop">Laptop</option>
          </select>
        </div>

        <div>
          <label for="manufacturer" class="mb-1 block text-sm font-medium text-gray-700">Manufacturer *</label>
          <input id="manufacturer" formControlName="manufacturer" type="text" placeholder="e.g., Apple, Samsung" class="w-full rounded-lg border border-gray-300 px-3 py-2" />
        </div>

        <div class="sm:col-span-2">
          <label for="model" class="mb-1 block text-sm font-medium text-gray-700">Model *</label>
          <input id="model" formControlName="model" type="text" placeholder="e.g., iPhone 15 Pro" class="w-full rounded-lg border border-gray-300 px-3 py-2" />
        </div>

        <div>
          <label for="imei-serial" class="mb-1 block text-sm font-medium text-gray-700">IMEI / Serial Number</label>
          <input id="imei-serial" formControlName="imei_serial" type="text" class="w-full rounded-lg border border-gray-300 px-3 py-2" />
        </div>

        <div>
          <label for="color" class="mb-1 block text-sm font-medium text-gray-700">Color</label>
          <input id="color" formControlName="color" type="text" placeholder="e.g., Black" class="w-full rounded-lg border border-gray-300 px-3 py-2" />
        </div>

        <div class="sm:col-span-2">
          <label for="device-passcode" class="mb-1 block text-sm font-medium text-gray-700">Device Passcode</label>
          <input id="device-passcode" formControlName="device_passcode" type="text" autocomplete="off" class="w-full rounded-lg border border-gray-300 px-3 py-2" />
          <p class="mt-1 text-xs text-gray-500">Visible to authorized technicians for repair work.</p>
        </div>
      </div>

      <div class="flex justify-end gap-3 border-t border-gray-200 pt-5">
        <button type="button" (click)="close.emit()" class="rounded-lg border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Cancel</button>
        <button type="submit" [disabled]="loading" class="rounded-lg bg-primary px-4 py-2 text-sm text-white hover:bg-primary-dark disabled:opacity-50">
          {{ loading ? 'Saving...' : (mode === 'create' ? 'Register Device' : 'Save Changes') }}
        </button>
      </div>
    </form>
  </div>
</div>
