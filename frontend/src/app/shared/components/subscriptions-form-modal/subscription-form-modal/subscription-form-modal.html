<div class="modal-overlay">
  <div class="modal-content">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-semibold">
        {{ mode === 'create' ? 'Add New Subscription' : 'Edit Subscription' }}
      </h2>
      <lucide-icon 
        name="x" 
        class="w-5 h-5 cursor-pointer hover:bg-gray-200 rounded-full p-1" 
        (click)="close.emit()">
      </lucide-icon>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
      {{ error }}
    </div>

    <!-- Form -->
    <form [formGroup]="subscriptionForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <!-- CREATE MODE: Client Dropdown -->
      <div *ngIf="mode === 'create'" class="flex flex-col gap-2">
        <label class="block text-sm font-medium">Customer <span class="text-red-500">*</span></label>
        <select formControlName="client_id" class="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="" disabled>Select a customer</option>
          <option *ngFor="let client of clients" [value]="client.id">
            {{ client.full_name }}
          </option>
        </select>
        <div *ngIf="subscriptionForm.get('client_id')?.invalid && subscriptionForm.get('client_id')?.touched" 
             class="text-red-500 text-xs">
          Customer is required
        </div>
      </div>

      <!-- EDIT MODE: Display Customer Name (Read-only) -->
      <div *ngIf="mode === 'edit'" class="flex flex-col gap-2">
        <label class="block text-sm font-medium text-gray-600">Customer</label>
        <div class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 text-gray-900">
          {{ getClientName(subscription?.client_id) }}
        </div>
      </div>

      <!-- CREATE MODE: Service Type -->
      <div *ngIf="mode === 'create'" class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="block text-sm font-medium">Service Type <span class="text-red-500">*</span></label>
          <select formControlName="service_type" class="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="Phone">Phone</option>
            <option value="WiFi">WiFi</option>
          </select>
        </div>

        <!-- CREATE MODE: Carrier -->
        <div class="flex flex-col gap-2">
          <label class="block text-sm font-medium">Carrier <span class="text-red-500">*</span></label>
          <input 
            formControlName="carrier" 
            type="text" 
            placeholder="e.g., AT&T, Comcast" 
            class="w-full border border-gray-300 rounded-lg px-3 py-2" />
          <div *ngIf="subscriptionForm.get('carrier')?.invalid && subscriptionForm.get('carrier')?.touched" 
               class="text-red-500 text-xs">
            Carrier is required
          </div>
        </div>
      </div>

      <!-- Status (Edit Mode Only) -->
      <div *ngIf="mode === 'edit'" class="flex flex-col gap-2">
        <label class="block text-sm font-medium">Status <span class="text-red-500">*</span></label>
        <select formControlName="status" class="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="Paid">Paid</option>
          <option value="Unpaid">Unpaid</option>
          <option value="Overdue">Overdue</option>
        </select>
      </div>

      <!-- Plan Amount -->
      <div class="flex flex-col gap-2">
        <label class="block text-sm font-medium">Plan Amount <span class="text-red-500">*</span></label>
        <input 
          formControlName="plan_amount" 
          type="number" 
          step="0.01" 
          placeholder="0.00" 
          class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        <div *ngIf="subscriptionForm.get('plan_amount')?.invalid && subscriptionForm.get('plan_amount')?.touched" 
             class="text-red-500 text-xs">
          Valid plan amount is required (minimum $0.01)
        </div>
      </div>

      <!-- Payment Due Day -->
      <div class="flex flex-col gap-2">
        <label class="block text-sm font-medium">Payment Due Day (1-31)</label>
        <input 
          formControlName="payment_due_day" 
          type="number" 
          min="1" 
          max="31" 
          placeholder="e.g., 15" 
          class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        <div *ngIf="subscriptionForm.get('payment_due_day')?.invalid && subscriptionForm.get('payment_due_day')?.touched" 
             class="text-red-500 text-xs">
          Payment due day must be between 1 and 31
        </div>
      </div>

      <!-- Active Toggle (Edit Mode Only) -->
      <div *ngIf="mode === 'edit'" class="flex items-center gap-3">
        <input 
          formControlName="is_active" 
          type="checkbox" 
          id="is_active"
          class="w-4 h-4 rounded" />
        <label for="is_active" class="text-sm font-medium cursor-pointer">
          Active Subscription
        </label>
      </div>

      <!-- Form Actions -->
      <div class="flex gap-3 justify-end pt-6 border-t border-gray-200">
        <button 
          type="button" 
          (click)="close.emit()" 
          class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
          Cancel
        </button>
        <button 
          type="submit" 
          [disabled]="loading || !subscriptionForm.valid"
          class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          {{ loading ? 'Loading...' : (mode === 'create' ? 'Create Subscription' : 'Update Subscription') }}
        </button>
      </div>
    </form>
  </div>
</div>
